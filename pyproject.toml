[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mocu-imap-mcp"
version = "0.1.1"
description = "Read-only multi-account MCP server for generic IMAP mail and invoice attachment access"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.12",
  "types-html5lib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
