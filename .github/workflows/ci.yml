name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        dependency-set: ["latest", "minimum"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          if [ "${{ matrix.dependency-set }}" = "minimum" ]; then
            python -m pip install "mcp==2.0.0" "pydantic==2.13.*" "pydantic-settings==2.15.*" "cryptography==46.0.0"
            python -m pip install -e ".[dev]"
          else
            python -m pip install -e ".[dev]"
          fi

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy src

      - name: Pytest
        run: python -m pytest

      - name: MCP smoke test
        run: python scripts/test_mcp.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mocu-imap:multi-account-review .
      - name: Runtime smoke
        run: python3 scripts/test_docker.py

  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked runtime
        run: python -m pip install -r requirements.lock
      - name: Real provider and browser integration
        run: python scripts/test_auth_e2e.py
